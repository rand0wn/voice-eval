name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: CLI smoke test
        run: >-
          voice-eval compare
          --scenario arjun_cancel
          --adapters cascade degraded
          --output /tmp/voice-eval-smoke

  wheel:
    name: Installed wheel smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/voice-eval-wheel
          /tmp/voice-eval-wheel/bin/python -m pip install dist/*.whl
      - name: Run installed CLI outside the repository
        working-directory: /tmp
        run: |
          /tmp/voice-eval-wheel/bin/voice-eval compare \
            --scenario arjun_cancel \
            --adapters cascade degraded \
            --audio \
            --output /tmp/voice-eval-installed
      - name: Validate generated WAV artifacts
        run: |
          /tmp/voice-eval-wheel/bin/python - <<'PY'
          import wave
          from pathlib import Path

          paths = sorted(Path("/tmp/voice-eval-installed/audio").glob("**/*.wav"))
          assert paths, "installed-wheel run produced no WAV files"
          for path in paths:
              with wave.open(str(path), "rb") as wav:
                  assert wav.getnchannels() == 1
                  assert wav.getframerate() == 16_000
                  assert wav.getnframes() > 0
          print(f"validated {len(paths)} WAV files")
          PY
